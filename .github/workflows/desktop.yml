name: Native AIN desktop smoke test
on:
  push:
    branches: [feature/ainex-desktop-runtime]
  pull_request:
    paths:
      - 'runtime/ain_desktop.rs'
      - 'src/compiler.rs'
      - 'src/main.rs'
      - 'examples/desktop.ain'
      - '.github/workflows/desktop.yml'
jobs:
  gtk4-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native GTK4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config
      - name: Test compiler
        run: cargo test
      - name: Compile GTK4 Ain example
        run: cargo run -- build examples/desktop.ain -o /tmp/ain-desktop
