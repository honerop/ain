name: Build babelc binaries

# Each update to main gets downloadable binaries. PRs validate portability.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extension: ''
            package_format: tar.gz
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            extension: ''
            package_format: tar.gz
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            extension: ''
            package_format: tar.gz
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: ''
            package_format: tar.gz
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
            package_format: zip
    defaults:
      run:
        shell: bash
    env:
      BABEL_PLATFORM: ${{ matrix.platform }}
      BABEL_TARGET: ${{ matrix.target }}
      BABEL_EXTENSION: ${{ matrix.extension }}
      BABEL_FORMAT: ${{ matrix.package_format }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain for static Linux binaries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release compiler
        run: cargo build --release --target "$BABEL_TARGET" --bin babelc

      - name: Verify the executable
        run: |
          bin="target/$BABEL_TARGET/release/babelc$BABEL_EXTENSION"
          test -f "$bin"
          "./$bin" --version
          printf 'print 42\n' > binary-smoke.babel
          "./$bin" check binary-smoke.babel

      - name: Verify Linux binaries have no dynamic loader
        if: runner.os == 'Linux'
        run: |
          bin="target/$BABEL_TARGET/release/babelc"
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "Linux executable unexpectedly requires a dynamic interpreter"
            exit 1
          fi

      - name: Package compiler and checksums
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          platform = os.environ["BABEL_PLATFORM"]
          target = os.environ["BABEL_TARGET"]
          extension = os.environ["BABEL_EXTENSION"]
          package_format = os.environ["BABEL_FORMAT"]
          binary = Path("target") / target / "release" / ("babelc" + extension)
          assert binary.is_file(), f"missing executable: {binary}"
          output = Path("dist")
          output.mkdir(exist_ok=True)
          root = "babelc-" + platform
          archive = output / (root + "." + package_format)
          items = [(binary, root + "/" + binary.name),
                   (Path("LICENSE"), root + "/LICENSE"),
                   (Path("README.md"), root + "/README.md")]
          if package_format == "zip":
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
                  for source, name in items:
                      bundle.write(source, arcname=name)
          else:
              with tarfile.open(archive, "w:gz") as bundle:
                  for source, name in items:
                      bundle.add(source, arcname=name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (output / (archive.name + ".sha256")).write_text(
              f"{digest}  {archive.name}\n", encoding="utf-8")
          print(f"Packaged {archive} ({archive.stat().st_size} bytes)")
          PY

      - name: Upload downloadable binary
        uses: actions/upload-artifact@v4
        with:
          name: babelc-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish pre-release with tested binaries
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and avoid republishing existing tags
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; do not replace its assets."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_sha="$(git rev-list -n 1 "refs/tags/$tag")"
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points to $tagged_sha, not the current commit. Bump the Cargo version or publish manually."
              exit 1
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Download binaries from this verified build
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: babelc-*
          path: dist
          merge-multiple: true

      - name: Verify all five platforms and checksums
        if: steps.version.outputs.exists == 'false'
        run: |
          cd dist
          test "$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 5
          test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 5
          sha256sum --check ./*.sha256

      - name: Publish GitHub pre-release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            notes="CHANGELOG.md"
          fi
          gh release create "$TAG" \
            dist/*.tar.gz dist/*.zip dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Babel $TAG (experimental)" \
            --notes-file "$notes" \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
