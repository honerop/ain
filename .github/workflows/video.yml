name: Ain-only Y4M video

on:
  push:
    paths:
      - "apps/video/**"
      - "tests/video_generator.rs"
      - ".github/workflows/video.yml"
  pull_request:
    paths:
      - "apps/video/**"
      - "tests/video_generator.rs"
      - ".github/workflows/video.yml"

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native Ain-only video generator
        run: cargo test --test video_generator
