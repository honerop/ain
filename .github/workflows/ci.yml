name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: LLVM native toolchain
        run: clang --version
      - name: Rust compiler tests
        run: cargo test
      - name: Rust-first three-stage bootstrap
        run: ./scripts/bootstrap.sh
      - name: Independent reference bootstrap
        run: ./scripts/bootstrap.sh --reference
      - name: Install GTK4 and virtual display
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb dbus-x11
      - name: Smoke test nonblocking GTK4 event loop in Ain
        run: |
          cargo run --quiet -- build examples/gui_tick.ain -o /tmp/ain-gui-tick
          result=$(timeout 15s xvfb-run -a dbus-run-session /tmp/ain-gui-tick)
          test "$result" = "tick"
