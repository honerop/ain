name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: LLVM native toolchain
        run: clang --version
      - name: Rust compiler tests
        run: cargo test
      - name: Native benchmark smoke test
        run: cargo run -- bench examples/arithmetic.ain --backend both --runs 1 --json
      - name: Native source token benchmark (o200k_base)
        run: |
          cargo test --features token-bench
          cargo run --features token-bench -- tokens benchmarks/tokens/*/* --json
      - name: Measure compact list syntax against original
        run: |
          cargo run --quiet --features token-bench -- tokens \
            benchmarks/tokens/lists/ain.ain benchmarks/experiments/*.ain --json
      - name: Rust-first three-stage bootstrap
        run: ./scripts/bootstrap.sh
      - name: Independent reference bootstrap
        run: ./scripts/bootstrap.sh --reference
      - name: Install GTK4 and virtual display
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb dbus-x11
      - name: Smoke-test rich native GTK4 widgets
        run: |
          cargo run --quiet -- build examples/gui_rich.ain -o /tmp/ain-gui-rich
          timeout 15s xvfb-run -a dbus-run-session /tmp/ain-gui-rich > /tmp/ain-gui-rich.log 2>&1
          cat /tmp/ain-gui-rich.log
          grep -x 'tick' /tmp/ain-gui-rich.log
      - name: Smoke test nonblocking GTK4 event loop in Ain
        run: |
          cargo run --quiet -- build examples/gui_tick.ain -o /tmp/ain-gui-tick
          set +e
          timeout 15s xvfb-run -a dbus-run-session /tmp/ain-gui-tick > /tmp/ain-gui.log 2>&1
          code=$?
          set -e
          cat /tmp/ain-gui.log
          test "$code" -eq 0
          grep -x 'tick' /tmp/ain-gui.log

      - name: Smoke-test composable layout and redraw
        run: |
          cargo run --quiet -- build examples/gui_layout.ain -o /tmp/ain-gui-layout
          timeout 15s xvfb-run -a dbus-run-session /tmp/ain-gui-layout > /tmp/ain-gui-layout.log 2>&1
          cat /tmp/ain-gui-layout.log
          test "$(grep -cx 'tick' /tmp/ain-gui-layout.log)" -eq 2
