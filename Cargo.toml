[package]
name = "ain-compiler"
version = "0.3.0"
edition = "2021"
description = "A tiny statically typed AI-native language transpiler"
license = "MIT"

[[bin]]
name = "ainc"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
default = []
# Only tokenizer benchmarks depend on a large vocabulary; regular builds stay dependency-free.
token-bench = ["dep:tiktoken"]

[dependencies]
tiktoken = { version = "4.1.2", default-features = false, features = ["vocab-o200k_base"], optional = true }
